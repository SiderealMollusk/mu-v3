name: Add Issue to Project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v1.0.2
        with:
          # Update this URL to match your GitHub Project
          # Format for user projects: https://github.com/users/{USERNAME}/projects/{PROJECT_NUMBER}
          # Format for org projects: https://github.com/orgs/{ORG}/projects/{PROJECT_NUMBER}
          project-url: https://github.com/users/SiderealMollusk/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
